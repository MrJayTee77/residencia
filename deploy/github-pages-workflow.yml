name: Deploy to GitHub Pages

# The legacy (Jekyll) Pages builder began failing with a bare "Page build
# failed." and no log, so the site is built and deployed here instead. This also
# removes the manual gh-pages worktree step — pushing this branch deploys.
on:
  push:
    branches: [v3-ecosystem]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx astro build
      # .nojekyll keeps Pages from reprocessing the _astro/ directory.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
